name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Uses the gradle/actions setup-gradle action so this works even
      # before a committed Gradle wrapper (gradlew) is present.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lint (ktlint / detekt)
        run: gradle ktlintCheck detekt --continue

      - name: Unit tests
        run: gradle test
